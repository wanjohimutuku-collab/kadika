# Everything the browser checks need before they start: dependencies, optionally Chromium, and a
# production build of the web app in .next-prod. Shared by the e2e shards, Lighthouse and warm-caches.yml.
name: Web production build
description: Install the workspace and optionally Chromium, then build the web app for the browser checks
inputs:
  playwright:
    description: Install Playwright's Chromium and its system packages. Lighthouse uses the runner's own Chrome.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # A stalled Ubuntu mirror waits 120 seconds per package by default, which once cost a job 9 minutes.
    # Give up on a stalled download quickly and try again instead.
    - if: inputs.playwright == 'true'
      run: printf 'Acquire::http::Timeout "15";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
      shell: bash
    - if: inputs.playwright == 'true'
      run: pnpm --filter @harusi/web exec playwright install --with-deps chromium
      shell: bash
    # Next's compile cache. Keyed per commit and restored from the newest earlier run; the parallel jobs
    # of one run share a key, so the first to finish saves it and the others skip.
    - uses: actions/cache@v4
      with:
        path: apps/web/.next-prod/cache
        key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          next-e2e-${{ runner.os }}-
    - run: pnpm --filter @harusi/web e2e:build
      shell: bash
