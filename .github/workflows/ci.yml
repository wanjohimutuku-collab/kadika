name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Tests run TS through vitest, which forgives ESM import paths that plain Node rejects in the
      # bundle (a missing `.js` once crash-looped the deployed API). Boot the bundle and hit /health.
      - name: Smoke-test the built API bundle
        working-directory: apps/api
        env:
          NODE_ENV: production
          JWT_SECRET: ci-smoke-${{ github.run_id }}-secret
          KEY_ENC_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          API_PORT: 3999
          LOG_REQUESTS: 0
        run: |
          node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3999/health > /dev/null; then kill $!; exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - run: pnpm --filter @harusi/web build-storybook
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true # advisory until Phase 7 hardening

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @harusi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @harusi/web e2e:build
      - run: pnpm --filter @harusi/web e2e
      - run: pnpm --filter @harusi/web lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
