name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out code and caches; it never writes to the repository.
permissions:
  contents: read

# A newer push to the same PR (or to main) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides how much of CI this change needs (ADR 056). Every job below treats a missing answer as "run
  # it", so if this job breaks everything runs and the run still goes red.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # finds the passing run on a PR's head
      contents: read
      pull-requests: read # lists a PR's files
    outputs:
      tested: ${{ steps.classify.outputs.tested }}
      code: ${{ steps.classify.outputs.code }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          everything() { out tested=false; out code=true; out web=true; echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename') \
              || everything "Could not list the PR's files; running everything."
          else
            # A PR that was up to date with main merges into a commit with exactly the files of its head,
            # which CI has just passed. Running it all again would only delay the release (release.yml
            # starts when this run ends); build-push's verify-ci accepts the same match.
            tree() { gh api "repos/$GH_REPO/commits/$1" --jq .commit.tree.sha; }
            head=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.parents[1].sha // empty') || head=
            if [ -n "$head" ] && [ "$(tree "$GITHUB_SHA")" = "$(tree "$head")" ] &&
              [ "$(gh run list --workflow ci.yml --commit "$head" --status success --json databaseId --jq length)" -gt 0 ]; then
              out tested=true; out code=false; out web=false
              echo "CI already passed on ${head::7}, which has exactly the files of ${GITHUB_SHA::7}. Nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            case "$BEFORE" in ''|0000000000000000000000000000000000000000) everything "No previous commit to compare with; running everything." ;; esac
            files=$(gh api "repos/$GH_REPO/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') \
              || everything "Could not compare with ${BEFORE::7}; running everything."
            # The compare API lists at most 300 files.
            [ "$(echo "$files" | wc -l)" -lt 300 ] || everything "Too many changed files to classify; running everything."
          fi

          code=false
          web=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Not read by any build, test or lint. Prettier still checks them (see the ci job).
            case "$f" in
              *.md | docs/* | infra/* | docker-compose*.yml | .claude/* | .impeccable/* | \
              .github/dependabot.yml | .github/workflows/build-push.yml | .github/workflows/mobile-eas.yml | \
              .github/workflows/release.yml | .github/workflows/warm-caches.yml | \
              scripts/deploy.sh | scripts/dev.sh | .deploy.env.example | .dockerignore | .gitattributes)
                continue ;;
            esac
            code=true
            # Packages the web app is not built from (see apps/web/package.json) cannot change Storybook or
            # the browser checks. Anything else, including a file nobody listed here, runs them.
            case "$f" in
              apps/api/* | apps/mobile/* | packages/crypto/* | packages/db/* | packages/gate/* | \
              packages/messaging/* | packages/payments/*)
                ;;
              *) web=true ;;
            esac
          done <<< "$files"
          out tested=false; out code=$code; out web=$web
          echo "Code changed: $code. Web app changed: $web." | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CODE: ${{ needs.changes.outputs.code }}
      WEB: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      # Docs and deploy config only: Prettier is the one check that reads them, so run just that, at the
      # version in the lockfile, without installing the workspace.
      - name: Check formatting only
        if: env.CODE == 'false'
        run: |
          version=$(sed -n 's/^  prettier@\([0-9][0-9.]*\):.*/\1/p' pnpm-lock.yaml | head -n1)
          npx --yes "prettier@$version" --check .

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
        if: env.CODE != 'false'
      - uses: actions/setup-node@v4
        if: env.CODE != 'false'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CODE != 'false'
      # Turbo's local cache, kept between runs: a package whose files did not change replays its
      # typecheck, lint, test and build results instead of running them again. Keyed per commit and
      # restored from the newest earlier run (PRs can read main's, which warm-caches.yml keeps fresh).
      - uses: actions/cache@v4
        if: env.CODE != 'false'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm typecheck
        if: env.CODE != 'false'
      - run: pnpm lint
        if: env.CODE != 'false'
      - run: pnpm format:check
        if: env.CODE != 'false'
      - run: pnpm test
        if: env.CODE != 'false'
      - run: pnpm build
        if: env.CODE != 'false'
      # Tests run TS through vitest, which forgives ESM import paths that plain Node rejects in the
      # bundle (a missing `.js` once crash-looped the deployed API). Boot the bundle and hit /health.
      - name: Smoke-test the built API bundle
        if: env.CODE != 'false'
        working-directory: apps/api
        env:
          NODE_ENV: production
          JWT_SECRET: ci-smoke-${{ github.run_id }}-secret
          KEY_ENC_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          API_PORT: 3999
          LOG_REQUESTS: 0
        run: |
          node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3999/health > /dev/null; then kill $!; exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - run: pnpm --filter @harusi/web build-storybook
        if: env.WEB != 'false'

  # Advisory until Phase 7 hardening, so it has its own job: nothing waits on its 40 seconds.
  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # The Playwright suite split over three machines (standard runners are free on this public repo).
  e2e:
    name: e2e ${{ matrix.shard }}/3
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # a failure in one shard should not hide failures in the others
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-prod-build
      - run: pnpm --filter @harusi/web e2e --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results

  lhci:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-prod-build
        with:
          playwright: 'false'
      # Simulated throttling on a shared runner is noisy near the budget, and a false red used to wait for
      # someone to press re-run. One automatic retry; a real regression fails both.
      - run: pnpm --filter @harusi/web lhci || pnpm --filter @harusi/web lhci

  # The required check on main. It reports the browser jobs as one result, whatever ran. A job skipped
  # by `changes` passes; anything else that is not a success fails it.
  web-e2e:
    needs: [changes, e2e, lhci]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the browser checks
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.e2e.result }}
          LHCI: ${{ needs.lhci.result }}
        run: |
          echo "changes=$CHANGES e2e=$E2E lhci=$LHCI"
          [ "$CHANGES" = success ] || { echo "::error::The changes job did not pass."; exit 1; }
          for result in "$E2E" "$LHCI"; do
            case "$result" in success | skipped) ;; *) echo "::error::A browser check did not pass."; exit 1 ;; esac
          done
