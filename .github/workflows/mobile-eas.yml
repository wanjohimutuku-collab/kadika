# Preview APK on PR when it carries the `eas:preview` label; production AAB on tags like
# `mobile-v*`. Requires EXPO_TOKEN in repo secrets (Expo access token with EAS build scope).
name: Mobile EAS

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile from eas.json
        type: choice
        default: preview
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: mobile-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Preview only runs if the PR event carries the eas:preview label (or on resyncs of a PR that
    # already has it); production and manual dispatches run unconditionally.
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'eas:preview')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Tags push production; labelled PRs and workflow_dispatch default to preview.
      PROFILE: >-
        ${{ startsWith(github.ref, 'refs/tags/mobile-v')
            && 'production'
            || (inputs.profile || 'preview') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build Android ${{ env.PROFILE }}
        working-directory: apps/mobile
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
