<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gate scanner "KARIBU NDANI" result (ADR 022, ADR 056 item 3). Hand-drawn SVG captured once so
  the home page can show a real-looking scanner frame without a running demo. Colours come from
  packages/ui-tokens/src/colors.ts (gate ADMIT #075E20) and the .ks tokens in globals.css
  (--ks-green-700, --ks-gold-500). Width matches a ~390 px phone frame but the SVG is
  responsive. Alt text in the consuming <img> gives the text content for screen readers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" role="img" aria-labelledby="t d">
  <title id="t">Gate scanner admitting a guest</title>
  <desc id="d">Phone showing a green full-screen admit result for Fatuma Mwanga, party of two, from the Family group, at the Mlima gate.</desc>

  <!-- Phone shell -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F1D"/>
      <stop offset="1" stop-color="#0A1210"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6C3C"/>
      <stop offset="1" stop-color="#075E20"/>
    </linearGradient>
    <linearGradient id="statusChip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F5C4D"/>
      <stop offset="1" stop-color="#0A3F35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- phone outer bezel -->
  <rect x="16" y="24" width="368" height="772" rx="52" fill="url(#bezel)"/>
  <rect x="24" y="32" width="352" height="756" rx="46" fill="#000"/>

  <!-- notch -->
  <rect x="152" y="32" width="96" height="22" rx="11" fill="#0A1210"/>
  <circle cx="178" cy="43" r="4" fill="#1C2522"/>

  <!-- screen area, filled with the admit colour -->
  <rect x="32" y="54" width="336" height="726" rx="38" fill="url(#screenBg)"/>

  <!-- subtle glow behind the icon -->
  <circle cx="200" cy="260" r="110" fill="#5BD17F" opacity="0.18" filter="url(#soft)"/>

  <!-- top bar: gate name, status pill, sync -->
  <g font-family="'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="56" y="100" font-size="15" font-weight="600" fill="#F2EFE9">Lango A · Mlima</text>
    <g transform="translate(260 82)">
      <rect width="92" height="26" rx="13" fill="url(#statusChip)"/>
      <circle cx="14" cy="13" r="4" fill="#5BD17F"/>
      <text x="26" y="17" font-size="12" font-weight="600" fill="#F2EFE9">Imeungana</text>
    </g>
    <text x="56" y="124" font-size="13" fill="#D9F2E1" opacity="0.85">Wamefika 142 / 320 · 0 kusubiri</text>
  </g>

  <!-- big check icon -->
  <g transform="translate(200 260)">
    <circle r="78" fill="#F7FBF5" opacity="0.14"/>
    <circle r="62" fill="#F7FBF5"/>
    <path d="M -24 2 L -6 22 L 28 -16" stroke="#075E20" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- KARIBU NDANI heading -->
  <text x="200" y="400" text-anchor="middle" font-family="'Figtree', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="2">KARIBU NDANI</text>

  <!-- Guest name (display serif) -->
  <text x="200" y="460" text-anchor="middle" font-family="'Fraunces', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="42" font-weight="600" fill="#FFFFFF">Fatuma Mwanga</text>

  <!-- Party size + group -->
  <g transform="translate(50 500)" font-family="'Figtree', system-ui, sans-serif">
    <rect width="300" height="54" rx="16" fill="#0A3F35" opacity="0.72"/>
    <g transform="translate(20 20)" fill="#F2EFE9">
      <text y="16" font-size="15" opacity="0.72">Watu</text>
      <text x="48" y="18" font-size="18" font-weight="700">2</text>
    </g>
    <line x1="112" y1="14" x2="112" y2="40" stroke="#F2EFE9" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(132 20)" fill="#F2EFE9">
      <text y="16" font-size="15" opacity="0.72">Kundi</text>
      <text x="56" y="18" font-size="16" font-weight="600">Familia</text>
    </g>
  </g>

  <!-- QR source line + short code chip -->
  <g transform="translate(50 582)" font-family="'Figtree', system-ui, sans-serif">
    <text x="0" y="12" font-size="13" fill="#D9F2E1" opacity="0.85">QR halali · imesainiwa</text>
    <g transform="translate(0 22)">
      <rect width="172" height="36" rx="18" fill="#D9A441"/>
      <text x="22" y="24" font-size="15" font-weight="700" fill="#0A3F35" font-family="ui-monospace, Consolas, Menlo, monospace">KH-4821</text>
      <text x="100" y="24" font-size="11" fill="#0A3F35" opacity="0.72">namba ya kadi</text>
    </g>
  </g>

  <!-- Bottom primary action strip -->
  <g transform="translate(50 684)" font-family="'Figtree', system-ui, sans-serif">
    <rect width="300" height="52" rx="26" fill="#FFFFFF"/>
    <circle cx="36" cy="26" r="16" fill="#E3F0EC"/>
    <path d="M 29 26 L 34 32 L 44 20" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="31" font-size="16" font-weight="700" fill="#0A3F35">Skani mgeni anayefuata</text>
  </g>

  <!-- Home bar -->
  <rect x="150" y="760" width="100" height="5" rx="2.5" fill="#F2EFE9" opacity="0.65"/>
</svg>
