# Coolify stack: api + web + postgres + redis as ONE resource (Docker Compose build pack).
# Setup: infra/coolify/README.md. Not for local dev (that is docker-compose.yml).
#
# SERVICE_* values are Coolify magic variables: Coolify generates them once and keeps them.
#   SERVICE_URL_<SVC>_<PORT>  public https URL routed to that container port (set the domain in the UI)
#   SERVICE_PASSWORD_*        random password; SERVICE_REALBASE64_32_* = base64 of 32 random bytes
# ${VAR:?} blocks the deploy until it is filled in; ${VAR:-x} is an editable default.
#
# The images are built and pushed by .github/workflows/build-push.yml. IMAGE_TAG picks the
# channel: `staging` (every push to main) or `production` (v* tags). The stack tracks the
# `deploy/staging` or `deploy/production` branch with Auto Deploy on; the workflow moves that
# branch once the images are pushed, which triggers the deploy (ADR 034).
#
# The resource limits fit the whole stack (about 2.5 GB, 3.5 CPUs at most) on one small VPS next to
# Coolify itself, so one runaway container cannot starve the others. Raise them with the VPS size.

services:
  api:
    image: ghcr.io/wanjohimutuku-collab/kadika-api:${IMAGE_TAG:-staging}
    pull_policy: always
    # Migrations first; a failed migration stops the container before it serves traffic.
    # Keep ONE api replica: the migrator takes no lock.
    command: ['sh', '-c', 'node dist/migrate.js && exec node dist/index.js']
    restart: unless-stopped
    # Also runs the BullMQ workers and renders the print PDFs, so it gets more memory than web.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_URL_API_3001:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/harusi
      REDIS_URL: redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      # Decrypts every event's signing key. Never regenerate or edit it once events exist.
      KEY_ENC_SECRET: ${SERVICE_REALBASE64_32_KEYENC}
      # Set PUBLIC_WEB_URL and PUBLIC_API_URL in Coolify (e.g. https://kadisasa.com, https://api.kadisasa.com).
      # Coolify's own SERVICE_URL_* can stay empty even with domains set (and would name the first domain,
      # an sslip.io address); without a URL the API falls back to http://localhost:3000 for links
      # (gate-join) and has no URL for payment callbacks. Not named APP_BASE_URL / API_PUBLIC_URL:
      # Coolify shows every key below as read-only "managed by Docker Compose".
      APP_BASE_URL: ${PUBLIC_WEB_URL:-${SERVICE_URL_WEB_3000:-}}
      # This API's own public URL: where payment gateways (Snippe) post results (ADR 036). Without it
      # the payment settings in /ops refuse a real gateway, because there is nowhere to send callbacks.
      API_PUBLIC_URL: ${PUBLIC_API_URL:-${SERVICE_URL_API_3001:-}}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-${SERVICE_URL_WEB_3000:-}}
      # Production: the other web hosts, comma-separated (https://www.<domain>,https://app.<domain>,https://my.<domain>).
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      # Link domain in SMS/WhatsApp. Fill in the short domain, or the web URL if there is none.
      SHORT_BASE_URL: ${SHORT_BASE_URL:?}
      # Delivery webhooks send this in the x-webhook-secret header.
      WEBHOOK_SECRET: ${SERVICE_PASSWORD_WEBHOOK}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Behind Cloudflare the real client IP is in cf-connecting-ip; rate limits key on it. Without the
      # header (no Cloudflare in front) the API falls back to the last X-Forwarded-For hop.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      # Spend guards: login codes per IP per hour, login codes per hour in total, and the 24-hour
      # SMS/WhatsApp count that raises an alert (docs/ops/production-readiness-audit.md).
      OTP_IP_HOURLY_LIMIT: ${OTP_IP_HOURLY_LIMIT:-20}
      OTP_GLOBAL_HOURLY_LIMIT: ${OTP_GLOBAL_HOURLY_LIMIT:-500}
      MESSAGE_DAILY_ALERT: ${MESSAGE_DAILY_ALERT:-5000}
      # Providers: everything is `fake` until filled in (fake = nothing is really sent or charged).
      # With SMS fake, organizers never receive their login OTP.
      # SMS, WhatsApp and the payment gateway are set in /ops/settings (ADR 031, 036), encrypted in the
      # database, and saved settings override everything below. These variables are only the first-start
      # fallback: the very first staff sign-in needs an SMS provider before anyone can open /ops, and a
      # deployment that used them keeps working until staff press "Move settings" in Settings, after
      # which they can be deleted here.
      SMS_PROVIDER: ${SMS_PROVIDER:-fake}
      NEXTSMS_USERNAME: ${NEXTSMS_USERNAME:-}
      NEXTSMS_PASSWORD: ${NEXTSMS_PASSWORD:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-fake}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TEMPLATE_INVITE: ${WHATSAPP_TEMPLATE_INVITE:-}
      WHATSAPP_TEMPLATE_REMINDER: ${WHATSAPP_TEMPLATE_REMINDER:-}
      WHATSAPP_TEMPLATE_PLEDGE: ${WHATSAPP_TEMPLATE_PLEDGE:-}
      WHATSAPP_TEMPLATE_CONTRIBUTION: ${WHATSAPP_TEMPLATE_CONTRIBUTION:-}
      WHATSAPP_FALLBACK_HOURS: ${WHATSAPP_FALLBACK_HOURS:-6}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      # Payments stay off while this is empty.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      KENYA_ENABLED: ${KENYA_ENABLED:-0}
    # Healthcheck (/health) comes from the image.

  web:
    image: ghcr.io/wanjohimutuku-collab/kadika-web:${IMAGE_TAG:-staging}
    pull_policy: always
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      api:
        condition: service_healthy
    # NEXT_PUBLIC_* are baked in when GitHub Actions builds the image (GitHub environment variables),
    # not set here. NEXT_PUBLIC_API_URL there must equal this stack's api URL.
    environment:
      SERVICE_URL_WEB_3000:
      # Read at request time by /programu (the Android app page); empty shows "coming soon".
      ANDROID_PLAY_URL: ${ANDROID_PLAY_URL:-}
      ANDROID_APK_URL: ${ANDROID_APK_URL:-}
    # Healthcheck (/api/health) comes from the image.

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: harusi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d harusi']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # BullMQ needs noeviction: an evicting Redis silently drops queued jobs. The cap sits under the
    # container limit, so a full Redis refuses writes (visible errors) instead of being OOM-killed.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '200mb',
        '--maxmemory-policy',
        'noeviction',
        '--requirepass',
        '${SERVICE_PASSWORD_REDIS}',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}

  # Nightly pg_dump of the stack's database (RESTORE.md). Dumps go to the pgbackups volume, 14 days
  # kept; with BACKUP_S3_BUCKET set each dump is also copied off the server (do this: a volume on the
  # same VPS does not survive losing the VPS). BACKUP_HEARTBEAT_URL is pinged after every good dump,
  # so the uptime monitor notices when backups stop (UPTIME.md). A first dump runs at start.
  backup:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${SERVICE_USER_POSTGRES}
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: harusi
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-23}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-harusi/postgres}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - pgbackups:/backups
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu -o pipefail
        if [ -n "$${BACKUP_S3_BUCKET}" ]; then apk add --no-cache aws-cli > /dev/null; fi
        echo "[backup] daily at $${BACKUP_HOUR_UTC}:00 UTC, keeping $${BACKUP_KEEP_DAYS} days"
        last=""
        while true; do
          day=$$(date -u +%Y%m%d)
          if [ ! -e /backups/.started ] || { [ "$$(date -u +%H)" = "$$(printf %02d "$${BACKUP_HOUR_UTC}")" ] && [ "$$last" != "$$day" ]; }; then
            touch /backups/.started
            last=$$day
            f="/backups/harusi-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            if pg_dump --no-owner --no-acl | gzip -9 > "$$f.tmp" && gzip -t "$$f.tmp" && [ "$$(wc -c < "$$f.tmp")" -gt 2000 ]; then
              mv "$$f.tmp" "$$f"
              echo "[backup] wrote $$f ($$(wc -c < "$$f") bytes)"
              ok=1
              if [ -n "$${BACKUP_S3_BUCKET}" ]; then
                ep=""; [ -n "$${BACKUP_S3_ENDPOINT}" ] && ep="--endpoint-url $${BACKUP_S3_ENDPOINT}"
                aws s3 cp "$$f" "s3://$${BACKUP_S3_BUCKET}/$${BACKUP_S3_PREFIX}/$$(basename "$$f")" $$ep --only-show-errors || { ok=0; echo "[backup] ERROR: upload failed"; }
              fi
              find /backups -name 'harusi-*.sql.gz' -mtime +"$${BACKUP_KEEP_DAYS}" -delete
              if [ "$$ok" = 1 ] && [ -n "$${BACKUP_HEARTBEAT_URL}" ]; then wget -q -O /dev/null "$${BACKUP_HEARTBEAT_URL}" || echo "[backup] heartbeat ping failed"; fi
            else
              rm -f "$$f.tmp"
              echo "[backup] ERROR: pg_dump failed or the dump is too small; nothing kept"
            fi
          fi
          sleep 300
        done

volumes:
  pgdata:
  redisdata:
  pgbackups:
